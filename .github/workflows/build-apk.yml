name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p dist
          cp -r index.html dist/
          [ -f manifest.json ] && cp manifest.json dist/ || true
          [ -f sw.js ] && cp sw.js dist/ || true
          [ -f logo.png ] && cp logo.png dist/ || true

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mahadev Construction" "com.mahadev.construction" --web-dir dist
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahadev-Construction-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
